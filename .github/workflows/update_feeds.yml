name: Threat Feeds Auto Update

on:
  schedule:
    - cron: '*/30 * * * *' # Her 30 dakikada bir çalışır
  workflow_dispatch: # Manuel tetikleme butonu

concurrency:
  group: threat-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tehdit Listelerini Güncelle
        run: python fetch_threats.py

      - name: Otomatik Commit ve Push (Zorlamalı / Çakışmasız)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Threat feeds otomatik güncellendi [Bot]"
          file_pattern: 'threat_ip.txt threat_domain.txt threat_url.txt'
          commit_user_name: "GitHub Action Bot"
          commit_user_email: "action@github.com"
          push_options: '--force'
