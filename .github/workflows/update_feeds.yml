name: Threat Feeds Auto Update

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik çalışır
  workflow_dispatch: # Manuel tetikleme butonu ekler

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tehdit Listelerini Güncelle
        run: python fetch_threats.py

      - name: Değişiklikleri Commit ve Push Et
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add threat_ip.txt threat_domain.txt threat_url.txt
          
          # Eğer değişiklik yoksa hata vermeden çıksın
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atılmadı."
            exit 0
          fi
          
          git commit -m "Threat feeds otomatik güncellendi [Bot]"
          git pull --rebase origin main
          git push origin main
