name: Auto Threat Intelligence Updater

on:
  schedule:
    # Her 30 dakikada bir çalışır
    - cron: '*/30 * * * *'
  workflow_dispatch: # Manuel tetikleme için

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Çek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Scripti Çalıştır
      run: python fetch_threats.py

    - name: Güncellenen Dosyaları Kaydet ve Push Et
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Kenny Bayram Bot"
        git add threat_ip.txt threat_domain.txt threat_url.txt
        git diff-index --quiet HEAD || git commit -m "Tehdit listeleri otomatik güncellendi [Bot]"
        git pull --rebase origin main
        git push
