name: Auto Threat Intelligence Updater

on:
  schedule:
    # Her 30 dakikada bir çalışır
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Çek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Scripti Çalıştır
      run: python fetch_threats.py

    - name: Güncellenen Dosyayı Kaydet ve Push Et
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Kenny Bayram Bot"
        git add threat_list.txt
        git diff-index --quiet HEAD || git commit -m "Threat list otomatik güncellendi [Bot]"
        git push
