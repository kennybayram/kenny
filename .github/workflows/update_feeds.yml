name: Threat Feeds Auto Update

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir çalışır
  workflow_dispatch: # Manuel tetikleme butonu

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tehdit Listelerini Güncelle
        run: python fetch_threats.py

      - name: Değişiklikleri Commit ve Push Et
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Uzak sunucudaki son durumu çek
          git fetch origin main
          
          git add threat_ip.txt threat_domain.txt threat_url.txt
          
          # Eğer dosyalarda değişiklik yoksa işlem yapma
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atılmadı."
            exit 0
          fi
          
          git commit -m "Threat feeds otomatik güncellendi [Bot]"
          
          # Çakışmaları aşmak için rebase yerine doğrudan zorlamasız push veya pull-strategy kullanıyoruz
          git push origin main || (git rebase origin main -X ours && git push origin main)
