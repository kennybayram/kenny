name: Auto Threat Intelligence Updater

on:
  schedule:
    # Her 30 dakikada bir otomatik çalışır
    - cron: '*/30 * * * *'
  workflow_dispatch: # Manuel tetikleme için

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Cek
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Tüm git geçmişini çekerek rebase çakışmalarını önler

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Scripti Calistir
      run: python fetch_threats.py

    
        else
          echo "Herhangi bir değişiklik yok, commit atlanıyor."
        fi
- name: Commit and Push
  run: |
    git config --local user.email "action@github.com"
    git config --local user.name "GitHub Action"
    git add .
    git commit -m "Threat list otomatik güncellendi [Bot]" || exit 0
    git pull --rebase origin main
    git push origin main
